<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda de postagem</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1b1b1f;--card:#f4f5f8;--mut:#666;--ac:#fe2c55}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--fg:#ececf1;--card:#1a1d27;--mut:#9aa0ad}}
body{font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:var(--bg);color:var(--fg)}
h1{font-size:22px;margin:8px 0}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}.card.past{opacity:.5}
.when{font-weight:700;color:var(--ac);font-size:17px}.ttl{font-weight:600;margin:2px 0 8px}
textarea{width:100%;box-sizing:border-box;min-height:84px;border-radius:8px;border:1px solid #8884;background:var(--bg);color:var(--fg);padding:8px;font:14px/1.4 system-ui}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.b,button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:600 15px system-ui;text-decoration:none;cursor:pointer}
button.s{background:#4a4f5c}.mut{color:var(--mut);font-size:13px}
</style></head><body>
<h1>Agenda de postagem</h1>
<p class="mut">Horário de Brasília. Baixe o vídeo, copie a legenda e poste no horário indicado. Marque "conteúdo gerado por IA" ao postar.</p>
<div id="app">Carregando...</div>
<script>
const REPO='KyoGhostt/tiktok-curiosidades';
const fmt=d=>d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
(async()=>{
 const app=document.getElementById('app');
 try{
  const rel=await (await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=15`)).json();
  const items=[];
  for(const r of rel){
   const m=(r.body||'').match(/<!--DATA:([\s\S]*?)-->/); if(!m) continue;
   let info; try{info=JSON.parse(m[1])}catch(e){continue}
   for(const p of info.partes){
    const a=(r.assets||[]).find(x=>x.name===p.arquivo);
    items.push({...p,hist:info.titulo,when:new Date(p.postar_em),url:a&&a.browser_download_url});
   }
  }
  items.sort((a,b)=>a.when-b.when);
  const now=new Date(); const up=items.filter(i=>i.when>=now-36e5), past=items.filter(i=>i.when<now-36e5).reverse();
  const card=i=>`<div class="card ${i.when<now-36e5?'past':''}"><div class="when">${fmt(i.when)}</div>
   <div class="ttl">${i.titulo}</div><textarea readonly id="t${i.arquivo}${i.when.getTime()}">${i.legenda}</textarea>
   <div class="row">${i.url?`<a class="b" href="${i.url}">Baixar vídeo</a>`:''}
   <button class="s" onclick="navigator.clipboard.writeText(document.getElementById('t${i.arquivo}${i.when.getTime()}').value);this.textContent='Copiado!'">Copiar legenda</button></div></div>`;
  app.innerHTML=(up.length?`<h2>Próximas postagens</h2>`+up.map(card).join(''):'<p>Nada agendado ainda.</p>')+(past.length?`<h2>Já passaram</h2>`+past.map(card).join(''):'');
 }catch(e){app.textContent='Não consegui carregar a agenda agora. Tente de novo em instantes.'}
})();
</script></body></html>
