name: fila-buffer
on:
  schedule: [{cron: "20 */3 * * *"}]   # de 3 em 3 horas: completa o Buffer com o estoque
  workflow_dispatch:
    inputs:
      acao: {description: "encher | retomar (despausa e enche) | pausar | estado", default: "encher"}
      lang: {description: "todos (padrão) | pt | en | es", default: "todos"}
permissions: {contents: write}
concurrency: {group: fila, cancel-in-progress: false}
jobs:
  fila:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        lang: ${{ fromJSON((github.event.inputs.lang == '' || github.event.inputs.lang == 'todos') && '["pt","es","en"]' || format('["{0}"]', github.event.inputs.lang)) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: src
      LANG_CODE: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Executar
        run: |
          source scripts/branches.sh
          prep estado /tmp/estado; prep media /tmp/media
          SUB=""; [ "$LANG_CODE" != "pt" ] && SUB="/$LANG_CODE"
          mkdir -p /tmp/estado$SUB /tmp/media$SUB; export ESTADO_DIR=/tmp/estado$SUB MEDIA_DIR=/tmp/media$SUB
          A="${{ github.event.inputs.acao || 'encher' }}"
          if [ "$A" = "estado" ]; then
            python - <<'PY'
          import json
          f=json.load(open(__import__('os').environ['ESTADO_DIR']+'/fila.json'))
          print('::notice::pausado=%s' % f.get('pausado'))
          for s in f['stories']:
              print('::notice::%s | %s' % (s['titulo'], ' '.join('%s:%s' % (p['parte'],p['status']) for p in s['partes'])))
          PY
            exit 0
          fi
          [ "$A" = "retomar" ] && python src/fila.py retomar
          [ "$A" = "pausar" ] && python src/fila.py pausar
          if [ "$A" = "encher" ] || [ "$A" = "retomar" ]; then
            python -u src/fila.py encher
            python src/fila.py limpar | tee /tmp/limpar.txt   # apaga do branch media os vídeos postados há mais de 1 h
            grep -q "removidas [1-9]" /tmp/limpar.txt && push_media || true
            E=$(python src/fila.py estoque)
            [ "$E" -lt 6 ] && python -c "import telegram as t; t.configured() and t.send_message('Estoque baixo: so $E partes. Rode a geracao da semana (gerar-semana).')" || true
          fi
          push_estado
