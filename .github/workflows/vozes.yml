name: vozes
on:
  workflow_dispatch:
    inputs:
      drive: {description: "link do Drive (zip de exemplos de voz)", default: ""}
permissions: {contents: write}
jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DRIVE_URL: ${{ github.event.inputs.drive }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg && pip install gdown pillow numpy librosa faster-whisper
      - run: |
          source scripts/branches.sh
          mkdir -p /tmp/previews && rm -rf /tmp/previews/*
          python -u src/vozes_zip.py 2>&1 | tee /tmp/previews/vozes.txt
          cd /tmp/previews && git init -q -b previews && git config user.name actions && git config user.email a@b.c
          git add -A && git commit -qm vozes && git push -q -f "$REMOTE" HEAD:previews
