name: tiktok-autorizar
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Código de autorização recebido na página de callback"
        required: true
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Trocar código por tokens
        env:
          CODE: ${{ inputs.code }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          REDIRECT_URI: https://kyoghostt.github.io/tiktok-curiosidades/callback.html
        run: python src/tiktok_auth.py
