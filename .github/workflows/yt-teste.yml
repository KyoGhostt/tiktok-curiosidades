name: yt-teste
# Gera 1 história (2+ partes) e a versão COMPLETA p/ YouTube (sem "Parte X de N"). Não mexe na fila nem no Buffer. Resultado: release yt-<id>.
on: {workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: yt-teste, cancel-in-progress: false}
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PYTHONPATH: src
      LANG_CODE: pt
      YT_COMPLETO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat
      - run: pip install -r requirements.txt
      - name: Gerar
        run: |
          source scripts/branches.sh
          prep estado /tmp/estado
          mkdir -p output && cp /tmp/estado/used_*.json output/ 2>/dev/null || true
          export ESTADO_DIR=/tmp/estado
          for t in 1 2 3; do
            python -u src/run.py > /tmp/h.log 2>&1 || true; tail -n 3 /tmp/h.log
            D=$(ls -dt output/hist-*/ 2>/dev/null | head -1)
            [ -f "${D}completo.mp4" ] && break
          done
          D=${D%/}; ID=$(basename $D)
          [ -f $D/completo.mp4 ] || { echo "::error::sem completo.mp4 (historia com 1 parte?)"; exit 1; }
          ffmpeg -loglevel error -y -i $D/parte1.mp4 -t 58 -c copy $D/short_teste.mp4
          gh release create yt-$ID $D/completo.mp4 $D/short_teste.mp4 --title "yt-$ID" --notes "teste YouTube"
          echo "::notice::release yt-$ID: $(jq -r .titulo $D/info.json) / $(du -m $D/completo.mp4 | cut -f1) MB"
