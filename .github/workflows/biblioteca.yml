name: biblioteca
on:
  workflow_dispatch:
    inputs:
      url: {description: "(opcional) URL direta de um mp4 já recortado (ex.: vidIQ); se vazio, usa fundos/links.txt + cookie", default: ""}
      nome: {description: "(com url) nome do arquivo, ex.: gta_P3b3AidldmA.mp4", default: ""}
permissions: {contents: write}
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      DIRETO_URL: ${{ github.event.inputs.url }}
      DIRETO_NOME: ${{ github.event.inputs.nome }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg && pip install -U yt-dlp pillow requests
      - run: |
          source scripts/branches.sh
          mkdir -p /tmp/previews
          python -u src/biblioteca.py 2>&1 | tee /tmp/previews/biblioteca.txt
          cd /tmp/previews && git init -q -b previews && git config user.name actions && git config user.email a@b.c
          git add -A && git commit -qm biblioteca && git push -q -f "$REMOTE" HEAD:previews
