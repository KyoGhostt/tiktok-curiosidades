name: limpar-releases
# Uso unico (14/11): apaga releases de teste do YouTube/SFX/story antigo e a branch diag. Pode apagar este arquivo depois.
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  l:
    runs-on: ubuntu-24.04
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - run: |
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name|test("^(yt-|yts-|teste-sfx|story-hist)"))|.tag_name'); do
            gh release delete "$t" --cleanup-tag -y -R "$GITHUB_REPOSITORY" && echo "::notice::apagada $t"
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/diag" && echo "::notice::branch diag apagada"
