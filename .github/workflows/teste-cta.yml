name: teste-cta
# limpeza de uso unico: apaga a release de teste do CTA
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  t:
    runs-on: ubuntu-24.04
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - run: |
          for T in $(gh release list -R "$GITHUB_REPOSITORY" --json tagName --jq '.[]|select(.tagName|startswith("teste-"))|.tagName'); do gh release delete "$T" -R "$GITHUB_REPOSITORY" --cleanup-tag -y; done
