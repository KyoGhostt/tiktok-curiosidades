name: fundos-jogos
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg && pip install requests pillow
      - run: |
          source scripts/branches.sh
          mkdir -p /tmp/previews
          rm -rf /tmp/previews/*; python -u src/fundos_rotas.py 2>&1 | tee /tmp/previews/rotas.txt
          cd /tmp/previews && git init -q -b previews && git config user.name actions && git config user.email a@b.c
          git add -A && git commit -qm sondagem && git push -q -f "$REMOTE" HEAD:previews
