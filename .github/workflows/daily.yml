name: curiosidades-diario
on:
  schedule: [{cron: "0 12,22 * * *"}]   # 09h e 19h de Brasília
  workflow_dispatch:
permissions: {contents: read, issues: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Gerar e publicar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python -u src/main.py 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: |
            output/**/*.mp4
            output/**/info.json
          retention-days: 14
      - name: Abrir Issue se falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo '```'; tail -n 40 run.log | cut -c1-400; echo '```'; } > body.md
          gh issue create --title "Pipeline falhou em $(date +%F)" --body-file body.md
