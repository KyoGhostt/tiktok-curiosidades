name: curiosidades-diario
on:
  schedule: [{cron: "0 9 * * *"}]   # 06h de Brasília: gera 1 história (3 partes)
  workflow_dispatch:
permissions: {contents: write, issues: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat
      - run: pip install -r requirements.txt
      - name: Restaurar histórico de temas
        run: |
          mkdir -p output
          if git fetch origin previews --depth=1 2>/dev/null; then for f in used_topics.json used_stories.json schedule_state.json; do git show FETCH_HEAD:$f > output/$f 2>/dev/null || rm -f output/$f; done; fi
      - name: Gerar e publicar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u src/run.py 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Enviar ao Buffer (agenda no TikTok)
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          D=$(ls -d output/hist-*/ output/2*/ 2>/dev/null | tail -1)
          [ -n "$D" ] && [ -f "$D/info.json" ] || { echo "sem pacote"; exit 0; }
          [ -n "$BUFFER_API_KEY" ] || { echo "BUFFER_API_KEY ausente: pulando"; exit 0; }
          D=${D%/}; N=$(basename "$D")
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          rm -rf /tmp/media && mkdir /tmp/media && cd /tmp/media && git init -q -b media
          git config user.name github-actions && git config user.email actions@github.com
          if git fetch -q "$REMOTE" media --depth=1 2>/dev/null; then git checkout -q FETCH_HEAD -B media; fi
          find . -maxdepth 1 -mindepth 1 -type d ! -name .git -mtime +4 -exec rm -rf {} +
          mkdir -p "$N" && cp "$GITHUB_WORKSPACE/$D"/parte*.mp4 "$N"/
          git add -A && git commit -q -m "media $N" && git push -q -f "$REMOTE" media
          cd "$GITHUB_WORKSPACE"
          python -u src/buffer_post.py "$D" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/media" 2>&1 | tee -a run.log
      - name: Publicar prévia (branch previews)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(ls -d output/hist-*/ output/2*/ 2>/dev/null | tail -1)
          rm -rf /tmp/pv && mkdir /tmp/pv
          cp output/*.json /tmp/pv/ 2>/dev/null || true
          V=$(ls $D/parte1.mp4 $D/video.mp4 2>/dev/null | head -1)
          if [ -n "$D" ] && [ -n "$V" ]; then
            ffmpeg -y -loglevel error -i "$V" -vf "fps=1/4,scale=360:-1,tile=6x2" -frames:v 1 -q:v 3 /tmp/pv/contact.jpg || true
            ffmpeg -y -loglevel error -i "$V" -vf scale=540:-2 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 96k /tmp/pv/latest.mp4 || true
            cp "$D/info.json" /tmp/pv/ 2>/dev/null || true
          fi
          cd /tmp/pv && git init -q -b previews && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -q -m "previa $(date +%F-%H%M)" && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: |
            output/**/*.mp4
            output/**/info.json
          retention-days: 2
      - name: Abrir Issue se falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo '```'; tail -n 40 run.log | cut -c1-400; echo '```'; } > body.md
          gh issue create --title "Pipeline falhou em $(date +%F)" --body-file body.md
      - name: Avisar no Telegram se falhar
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cd src && python -c "import telegram as t; t.configured() and t.send_message('❌ O gerador diário falhou. Detalhes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID')"
