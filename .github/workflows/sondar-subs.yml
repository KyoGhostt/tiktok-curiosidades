name: sondar-subs
on:
  workflow_dispatch:
    inputs:
      subs: {description: "comunidades separadas por vírgula", default: "desahogo,confesiones,relatos"}
permissions: {contents: write}
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {GH_TOKEN: "${{ github.token }}", PYTHONPATH: src}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: |
          source scripts/branches.sh
          mkdir -p /tmp/previews && rm -rf /tmp/previews/*
          python -u src/sondar_subs.py "${{ github.event.inputs.subs }}" 2>&1 | tee /tmp/previews/subs.txt
          cd /tmp/previews && git init -q -b previews && git config user.name actions && git config user.email a@b.c
          git add -A && git commit -qm sondagem && git push -q -f "$REMOTE" HEAD:previews
